[project]
name = "proton-dose-m1"
version = "0.1.0"
description = "Deterministic moment-based proton transport and dose calculation solver."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.4.6",
    "pymedphys>=0.41.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]